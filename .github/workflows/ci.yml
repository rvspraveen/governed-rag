name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Both gates are installed from their release tags.
  RCC: "corpusgate @ git+https://github.com/rvspraveen/corpusgate@v0.2.0"
  REG: "rag-eval-gate @ git+https://github.com/rvspraveen/rag-eval-gate@v0.1.0"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # haiku.rag requires Python >= 3.12.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]" "$RCC"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (coverage gate 90%)
        run: pytest
      - name: Security scan (bandit)
        run: bandit -q -r src
      - name: Dependency audit (pip-audit)
        run: pip-audit --skip-editable

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install . "$RCC"
      - name: Corpus and eval cases are reproducible
        run: |
          python examples/make_corpus.py
          git diff --exit-code examples/ evals/
      - name: Broken corpus must be refused (exit 1) with nothing written
        run: |
          set +e
          grag ingest examples/corpus_bad -c examples/contract.yaml -p examples/policy.yaml --db bad.lancedb
          code=$?
          set -e
          test "$code" -eq 1
          test ! -e bad.lancedb
      - name: Sample corpus passes its contract and ingests
        run: grag ingest examples/corpus -c examples/contract.yaml -p examples/policy.yaml
      - name: Leak eval must stay at zero
        run: grag eval leak --corpus examples/corpus -p examples/policy.yaml
      - name: Export quality run for rag-eval-gate
        run: grag eval quality --corpus examples/corpus --out-dir out -p examples/policy.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-run
          path: out/
      - name: README output is real and current
        run: |
          python scripts/build_readme.py
          git diff --exit-code README.md

  quality-gate:
    # rag-eval-gate needs Python <= 3.12 and an older openai, so it runs in its own job.
    needs: dogfood
    runs-on: ubuntu-latest
    env:
      CONTINUOUS_EVAL_DO_NOT_TRACK: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quality-run
          path: out/
      - run: |
          python -m pip install "$REG"
          reg setup
      - name: Answer quality must not regress against the baseline
        run: |
          set +e
          reg gate -d out/dataset.jsonl -r out/run.jsonl -b evals/quality_baseline.json -g evals/quality_gate.yaml -f markdown -o quality.md
          code=$?
          set -e
          cat quality.md >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Action passes on the sample corpus
        uses: ./
        with:
          corpus: examples/corpus
          policy: examples/policy.yaml
          leak-cases: evals/leak_cases.yaml
      - name: Action fails on the broken corpus
        id: bad
        continue-on-error: true
        uses: ./
        with:
          corpus: examples/corpus_bad
          policy: examples/policy.yaml
          leak-cases: evals/leak_cases.yaml
      - name: Assert the broken corpus failed
        if: steps.bad.outcome != 'failure'
        run: exit 1
