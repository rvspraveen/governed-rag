# corpusgate gate run by `grag ingest --contract` before anything is written.
version: 1
rag:
  - test: required_fields
    fields: [chunk_id, doc_id, text, acl, source]
  - test: unique_ids
    column: chunk_id
  - test: chunk_length
    column: text
    min_chars: 40
    max_chars: 1200
  - test: duplicate_text
    column: text
  - test: acl_required
    column: acl
    allowed: [public, finance, hr, legal]
  - test: pii_patterns
    column: text
    patterns: [email, us_phone, us_ssn, card_number]
    severity: warn
  - test: source_metadata
    fields: [source, title]
    max_null_pct: 0
